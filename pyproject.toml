[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmp"
version = "0.2.0"
description = "Animated Comics/Manga-Manhwa Panels - Turn static comic pages into motion comic videos"
requires-python = ">=3.10"
dependencies = [
    # headless build: no libGL/GUI system deps — correct for a server/CLI/CI/Docker pipeline.
    # Pin <4.10: newer wheels declare numpy>=2, which breaks the stack below.
    "opencv-python-headless>=4.8,<4.10",
    "Pillow>=10.0,<12",  # moviepy/streamlit require Pillow <12
    "numpy>=1.24,<2",    # numpy 2.x breaks streamlit/moviepy/matplotlib in this stack
    "moviepy>=2.0",
    "pyyaml>=6.0",
    "PyMuPDF>=1.23",
    "click>=8.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
depth = [
    "torch>=2.1",
    "timm>=0.9",
]
segment = [
    "torch>=2.1",
    "torchvision>=0.16",
]
ai = [
    "diffusers>=0.25",
    "accelerate>=0.25",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
demo = [
    "streamlit>=1.30",
]
train = [
    "ultralytics>=8.2",
]

[project.scripts]
acmp = "acmp.cli:main"

[tool.setuptools.packages.find]
include = ["acmp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that run the full pipeline / ffmpeg (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, comprehensions
select = ["F", "E", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is enforced loosely; long URLs/strings are fine
    "B008",  # FastAPI uses function calls (Depends/File) in argument defaults
    "B905",  # zip(strict=) — opinionated; not worth churning existing zips
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests sometimes import after fixtures/markers
